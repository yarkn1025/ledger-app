name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build app
      run: |
        cd ios/App
        xcodebuild -scheme App -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" build 2>&1 | tail -50

    - name: Package IPA
      run: |
        cd ios/App
        ls -la build/Build/Products/
        mkdir -p Payload
        cp -R build/Build/Products/Release-iphoneos/App.app Payload/ 2>&1 || cp -R build/Build/Products/Debug-iphoneos/App.app Payload/ 2>&1
        zip -r App.ipa Payload
        mkdir -p output
        mv App.ipa output/
        ls -la output/

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/App/output/*.ipa
